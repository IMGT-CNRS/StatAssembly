stages:
  - build_and_upload

variables:
  VERSION: ${CI_COMMIT_TAG}
  BINARY_NAME: "IMGT_StatAssembly"

build-and-upload:
  stage: build_and_upload
  only:
    - tags
  image: rust:latest
  parallel:
    matrix:
      - TARGET: "x86_64-unknown-linux-gnu"
      - TARGET: "x86_64-pc-windows-gnu"
  before_script:
    - apt-get update
    - |
      if [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
        apt-get install -y libfontconfig1-dev libharfbuzz-dev libtiff-dev libconfig++-dev libconfig-dev
      elif [[ "$TARGET" == "x86_64-pc-windows-gnu" ]]; then
        apt-get install -y gcc-mingw-w64-x86-64
      fi
    - rustup target add "${TARGET}"
  script:
    - cargo build --verbose --release --target "${TARGET}"
    - mkdir "${BINARY_NAME}-${VERSION}-${TARGET}"
    - |
      if [[ "$TARGET" == "x86_64-pc-windows-gnu" ]]; then
        mv "target/${TARGET}/release/${BINARY_NAME}.exe" "${BINARY_NAME}-${VERSION}-${TARGET}/"
      else
        mv "target/${TARGET}/release/${BINARY_NAME}" "${BINARY_NAME}-${VERSION}-${TARGET}/"
      fi
    - |
      if [[ "$TARGET" == "x86_64-pc-windows-gnu" ]]; then
        7z a "${BINARY_NAME}-${VERSION}-${TARGET}.zip" "${BINARY_NAME}-${VERSION}-${TARGET}"
        echo "ASSET=${BINARY_NAME}-${VERSION}-${TARGET}.zip" >> build.env
      else
        tar -czf "${BINARY_NAME}-${VERSION}-${TARGET}.tar.gz" "${BINARY_NAME}-${VERSION}-${TARGET}"
        echo "ASSET=${BINARY_NAME}-${VERSION}-${TARGET}.tar.gz" >> build.env
      fi
  artifacts:
    paths:
      - "${BINARY_NAME}-${VERSION}-${TARGET}.*"
    expire_in: 1 week
